<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LineStream // ADMIN</title>
    <style>
        :root {
            --bg-color: #000000;
            --text-color: #e0e0e0;
            --accent-color: #00d9ff;
            --alert-color: #ff3333;
            --success-color: #33ff33;
            --panel-bg: #0a0a0a;
            --border-color: #333;
            --font-mono: 'Fira Code', 'Courier New', Courier, monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-mono);
            line-height: 1.5;
            padding: 20px;
            font-size: 14px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            /* 2 columns by default */
            gap: 20px;
        }

        header {
            grid-column: 1 / -1;
            border-bottom: 2px solid var(--accent-color);
            padding-bottom: 10px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }

        h1 {
            font-size: 24px;
            color: var(--accent-color);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        h2 {
            font-size: 16px;
            color: var(--accent-color);
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 5px;
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        .panel {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            padding: 15px;
            height: 400px;
            /* Fixed height for scrollable areas */
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .panel.auto-height {
            height: auto;
        }

        .panel-content {
            flex-grow: 1;
            overflow-y: auto;
            font-size: 12px;
        }

        /* Scrollbar Styling */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-color);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border-color);
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent-color);
        }

        /* Data Tables */
        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            text-align: left;
            padding: 5px;
            border-bottom: 1px solid #1a1a1a;
        }

        th {
            color: #888;
            font-weight: normal;
        }

        .text-right {
            text-align: right;
        }

        .text-accent {
            color: var(--accent-color);
        }

        .text-alert {
            color: var(--alert-color);
        }

        .text-success {
            color: var(--success-color);
        }

        /* Logs */
        .log-entry {
            margin-bottom: 5px;
            border-bottom: 1px solid #111;
            padding-bottom: 2px;
        }

        .log-time {
            color: #666;
            margin-right: 10px;
        }

        .log-error {
            color: var(--alert-color);
        }

        /* Buttons */
        .btn {
            background: transparent;
            border: 1px solid var(--accent-color);
            color: var(--accent-color);
            padding: 10px 20px;
            font-family: var(--font-mono);
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.2s;
        }

        .btn:hover {
            background: var(--accent-color);
            color: black;
        }

        .btn:active {
            transform: translateY(2px);
        }

        /* Status Grid */
        .status-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 15px;
        }

        .status-item {
            border: 1px solid #222;
            padding: 10px;
        }

        .status-label {
            font-size: 10px;
            color: #888;
            text-transform: uppercase;
        }

        .status-value {
            font-size: 18px;
            color: var(--text-color);
            margin-top: 5px;
        }

        /* Mobile */
        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
            }

            .panel {
                height: 350px;
            }

            .panel.auto-height {
                height: auto;
            }
        }

        .blink {
            animation: blink 1s step-end infinite;
        }

        @keyframes blink {
            50% {
                opacity: 0;
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <header>
            <h1>LineStream<span class="blink">_</span>Admin</h1>
            <div id="clock">00:00:00</div>
        </header>

        <!-- System Status -->
        <div class="panel auto-height">
            <h2>System Status</h2>
            <div class="panel-content status-grid" id="status-container">
                Loading...
            </div>
        </div>

        <!-- Quick Actions -->
        <div class="panel auto-height">
            <h2>Control Deck</h2>
            <div class="panel-content" style="display: flex; gap: 10px; align-items: center;">
                <button class="btn" onclick="triggerScrape()">Execute Scrape</button>
                <div id="action-feedback" style="margin-left: 10px; color: var(--accent-color);"></div>
            </div>
        </div>

        <!-- Live Feed -->
        <div class="panel" style="grid-column: 1 / -1;">
            <h2>Live Odds Feed (Live)</h2>
            <div class="panel-content">
                <table id="odds-table">
                    <thead>
                        <tr>
                            <th>Time</th>
                            <th>Book</th>
                            <th>Sport</th>
                            <th>Matchup</th>
                            <th>Market</th>
                            <th>Price</th>
                        </tr>
                    </thead>
                    <tbody id="odds-body">
                        <!-- Data here -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Logs -->
        <div class="panel">
            <h2>System Logs</h2>
            <div class="panel-content" id="system-logs"></div>
        </div>

        <!-- Errors -->
        <div class="panel">
            <h2>Error Stream</h2>
            <div class="panel-content" id="error-logs"></div>
        </div>
    </div>

    <script>
        // Clock
        setInterval(() => {
            document.getElementById('clock').innerText = new Date().toLocaleTimeString();
        }, 1000);

        // API Helpers
        async function fetchStatus() {
            try {
                const res = await fetch('/api/v1/admin/status');
                const data = await res.json();

                const stats = data.database?.stats || {};
                const dbSize = data.database?.size || 'N/A';
                const uptime = formatUptime(data.uptime);

                document.getElementById('status-container').innerHTML = `
                <div class="status-item">
                    <div class="status-label">Uptime</div>
                    <div class="status-value text-accent">${uptime}</div>
                </div>
                <div class="status-item">
                    <div class="status-label">DB Size</div>
                    <div class="status-value">${dbSize}</div>
                </div>
                <div class="status-item">
                    <div class="status-label">Events</div>
                    <div class="status-value">${stats.events_count || 0}</div>
                </div>
                <div class="status-item">
                    <div class="status-label">Odds Snapshots</div>
                    <div class="status-value">${formatCount(stats.odds_count || 0)}</div>
                </div>
                <div class="status-item">
                    <div class="status-label">Line Changes</div>
                    <div class="status-value text-accent">${formatCount(stats.changes_count || 0)}</div>
                </div>
            `;
            } catch (e) {
                console.error(e);
            }
        }

        async function fetchLogs() {
            try {
                const res = await fetch('/api/v1/admin/logs');
                const data = await res.json();

                // System Logs
                const sysContainer = document.getElementById('system-logs');
                sysContainer.innerHTML = data.system.map(log => `
                <div class="log-entry">
                    <span class="log-time">[${formatTime(log.timestamp)}]</span>
                    <span class="text-success">CYCLE ${log.cycleNumber}</span>
                    <span>Found ${log.arbitrageFound} arbs, ${log.changesDetected} changes</span>
                    <span style="color: #666">(${log.cycleTime}ms)</span>
                </div>
            `).join('');

                // Error Logs
                const errContainer = document.getElementById('error-logs');
                errContainer.innerHTML = data.errors.map(log => `
                <div class="log-entry">
                    <span class="log-time">[${formatTime(log.timestamp)}]</span>
                    <span class="log-error">${log.context}: ${log.message}</span>
                </div>
            `).join('');

            } catch (e) {
                console.error(e);
            }
        }

        async function fetchLiveOdds() {
            try {
                // Reusing existing public endpoint for now
                const res = await fetch('/api/v1/odds/live/nfl');
                const data = await res.json();

                const tbody = document.getElementById('odds-body');
                // Take last 20 items
                const rows = data.data.slice(0, 20).map(odd => `
                <tr>
                    <td>${formatTime(odd.timestamp)}</td>
                    <td class="text-accent">${odd.book}</td>
                    <td>${odd.sport}</td>
                    <td>${odd.home_team} vs ${odd.away_team}</td>
                    <td>${odd.market_type} (${odd.side})</td>
                    <td class="${odd.price > 0 ? 'text-success' : 'text-alert'}">${odd.price > 0 ? '+' + odd.price : odd.price}</td>
                </tr>
            `).join('');

                tbody.innerHTML = rows;
            } catch (e) {
                console.error(e);
            }
        }

        async function triggerScrape() {
            const feedback = document.getElementById('action-feedback');
            feedback.innerText = 'Initializing...';

            try {
                const res = await fetch('/api/v1/admin/scrape', { method: 'POST' });
                const data = await res.json();
                feedback.innerText = `STARTED (PID: ${data.pid})`;
                setTimeout(() => feedback.innerText = '', 5000);
            } catch (e) {
                feedback.innerText = 'ERROR';
            }
        }

        // formatting helpers
        function formatTime(iso) {
            if (!iso) return '--:--:--';
            return new Date(iso).toLocaleTimeString();
        }

        function formatUptime(sec) {
            const h = Math.floor(sec / 3600);
            const m = Math.floor((sec % 3600) / 60);
            return `${h}h ${m}m`;
        }

        function formatCount(num) {
            return parseInt(num).toLocaleString();
        }

        // Init
        fetchStatus();
        fetchLogs();
        fetchLiveOdds();

        // Poll
        setInterval(fetchStatus, 30000);
        setInterval(fetchLogs, 10000);
        setInterval(fetchLiveOdds, 5000);

    </script>
</body>

</html>
